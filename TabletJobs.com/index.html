<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coming Soon | Tablet Jobs</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #f4f7fb, #e8eef7);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .coming-soon-container {
            width: 90%;
            max-width: 650px;
            background: #ffffff;
            padding: 50px 35px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .logo {
            max-width: 220px;
            width: 100%;
            height: auto;
            margin-bottom: 25px;
        }

        .platform-name {
            font-size: 20px;
            font-weight: 600;
            color: #555;
            margin-bottom: 15px;
        }

        h1 {
            margin: 10px 0 15px;
            font-size: 42px;
            color: #1d3557;
        }

        .message {
            font-size: 17px;
            line-height: 1.6;
            color: #777;
            margin: 0 auto 30px;
            max-width: 500px;
        }

        .loader {
            width: 55px;
            height: 55px;
            border: 5px solid #e5e5e5;
            border-top: 5px solid #1d3557;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #999;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 600px) {
            .coming-soon-container {
                padding: 40px 20px;
            }

            h1 {
                font-size: 32px;
            }

            .platform-name {
                font-size: 18px;
            }

            .message {
                font-size: 15px;
            }

            .logo {
                max-width: 180px;
            }
        }
    </style>
</head>

<body>

    <div class="coming-soon-container">

        <img src="Images/jpglogo1.jpg" alt="Tablet Jobs" class="logo" />

        <div class="platform-name">
            The Online Interviews Platform
        </div>

        <h1>🚀 Coming Soon</h1>

       

        <div class="footer">
            © 2026 Tablet Jobs. All Rights Reserved.
        </div>

    </div>

</body>
</html>
